[package]
name = "psd-to-json"
version = "0.1.0"
edition = "2021"
description = "Convert Photoshop PSD files to JSON manifests with exported image assets"
license = "MIT"

[[bin]]
name = "psd-to-json"
path = "src/main.rs"

[lib]
name = "psd_to_json"
path = "src/lib.rs"

[dependencies]
psd = { git = "https://github.com/laffan/psd", branch = "master" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"
