<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSD to JSON</title>
  <link rel="stylesheet" href="/src-frontend/styles.css" />
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <h1>PSD to JSON</h1>

    <div class="sidebar-section">
      <label>PSD File</label>
      <div class="file-select">
        <button class="btn btn-browse" id="btn-select-psd">Select PSD...</button>
        <div class="path-display" id="psd-path-display">No file selected</div>
      </div>
    </div>

    <div class="sidebar-section">
      <label>Output Directory</label>
      <div class="file-select">
        <button class="btn btn-browse" id="btn-select-output">Select Folder...</button>
        <div class="path-display" id="output-path-display">No folder selected</div>
      </div>
    </div>

    <button class="btn btn-process" id="btn-process" disabled>
      Process PSD
    </button>

    <div class="sidebar-divider"></div>

    <!-- Options -->
    <div class="sidebar-section options-section">
      <button class="options-toggle" id="options-toggle">
        <span class="options-arrow">&#9654;</span> Options
      </button>
      <div class="options-body" id="options-body">

        <div class="option-group">
          <label for="opt-tile-size">Tile Slice Size</label>
          <input type="number" id="opt-tile-size" class="opt-input" value="512" min="32" step="1" />
        </div>

        <div class="option-group">
          <label for="opt-tile-scales">Tile Scaled Versions</label>
          <input type="text" id="opt-tile-scales" class="opt-input" value="" placeholder="e.g. 256, 128" />
          <span class="opt-hint">Comma-separated pixel sizes</span>
        </div>

        <div class="option-group">
          <label>PNG Quality Range</label>
          <div class="opt-row">
            <input type="number" id="opt-png-low" class="opt-input opt-half" value="45" min="0" max="100" />
            <span class="opt-sep">&ndash;</span>
            <input type="number" id="opt-png-high" class="opt-input opt-half" value="65" min="0" max="100" />
          </div>
        </div>

        <div class="option-group">
          <label for="opt-jpg-quality">JPG Quality</label>
          <input type="number" id="opt-jpg-quality" class="opt-input" value="85" min="0" max="100" />
        </div>

        <div class="option-group">
          <label for="opt-ignore">Ignore Layers</label>
          <input type="text" id="opt-ignore" class="opt-input" value="" placeholder="e.g. draft, reference" />
          <span class="opt-hint">Comma-separated layer names</span>
        </div>

        <div class="option-group opt-check-group">
          <label class="opt-checkbox-label">
            <input type="checkbox" id="opt-metadata-only" />
            Metadata only
          </label>
          <span class="opt-hint">Skip image export, generate JSON only</span>
        </div>

      </div>
    </div>

    <div class="sidebar-spacer"></div>

    <div class="status-bar" id="status-bar">Ready</div>
  </aside>

  <!-- Main Content -->
  <main class="content">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="terminal">Terminal</button>
      <button class="tab-btn" data-tab="thumbnails">Output</button>
    </div>

    <!-- Terminal Tab -->
    <div class="tab-panel active" id="panel-terminal">
      <div class="terminal" id="terminal">
        <div class="line welcome">Select a PSD file and output directory, then click "Process PSD" to begin.</div>
      </div>
    </div>

    <!-- Thumbnails Tab -->
    <div class="tab-panel" id="panel-thumbnails">
      <div class="thumbnail-container" id="thumbnail-container">
        <div class="thumbnail-empty" id="thumbnail-empty">
          No output files yet. Process a PSD to see results here.
        </div>
        <div class="thumbnail-grid" id="thumbnail-grid" style="display:none;"></div>
      </div>
    </div>
  </main>
</div>

<script type="module" src="/src-frontend/main.js"></script>

</body>
</html>
